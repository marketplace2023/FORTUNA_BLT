<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel · VLT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <div class="logo"><span class="logo-mark">♛</span><div><strong data-site>VLT</strong><small>Panel de administración</small></div></div>
      <label>Usuario<input name="username" autocomplete="username" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="loginErr"></p>
      <button class="btn primary wide" type="submit">Entrar</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <div class="logo"><span class="logo-mark">♛</span><div><strong data-site>VLT</strong><small>VLT · Panel</small></div></div>
      <nav id="nav">
        <a href="#dashboard" data-v="dashboard"><i>⌂</i>Dashboard</a>
        <a href="#players" data-v="players"><i>☺</i>Jugadores</a>
        <a href="#rounds" data-v="rounds"><i>↻</i>Rondas</a>
        <a href="#games" data-v="games"><i>▦</i>Juegos</a>
        <a href="#par" data-v="par"><i>∑</i>Matemática (PAR)</a>
        <a href="#audit" data-v="audit"><i>⛓</i>Auditoría</a>
        <a href="#settings" data-v="settings"><i>⚙</i>Configuración</a>
      </nav>
      <a class="side-link" href="/" target="_blank" rel="noopener">Abrir sitio ↗</a>
    </aside>
    <div class="main">
      <header class="bar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Menú">☰</button>
        <div class="bar-stats" id="barStats"></div>
        <div class="bar-user"><span id="who"></span><button class="btn ghost sm" id="logout" type="button">Salir</button></div>
      </header>
      <div class="view" id="view"></div>
    </div>
  </div>

  <dialog class="modal" id="modal"><div id="modalBody"></div></dialog>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
