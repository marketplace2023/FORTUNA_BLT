<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152d2a">
  <meta name="description" content="Dragón de Jade. Un santuario entre las nubes, 1.024 formas de ganar y cascadas con multiplicadores crecientes.">
  <title>Dragón de Jade · VLT Originals</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/dragon/sanctuary.png" as="image">
  <link rel="preload" href="/assets/dragon/symbols-v2.png" as="image">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/dragon.css">
  <link rel="stylesheet" href="/css/slot-cabinet.css">
</head>
<body class="dragon-game">
  <main class="stage" id="stage">
    <div class="machine slot-machine" id="machine">
      <header class="m-top">
        <a class="icon-btn back" href="/" aria-label="Volver al lobby">‹</a>
        <h1 id="title">Dragón de Jade</h1>
        <button class="icon-btn" id="soundBtn" type="button" aria-label="Activar o desactivar sonido" aria-pressed="true"></button>
      </header>
      <section class="slot-cabinet" aria-label="Tragamonedas">
        <div class="m-banner" id="banner" role="status" aria-live="polite"></div>
        <section class="board-wrap" id="boardWrap" aria-label="Tablero de cinco rodillos y cuatro filas">
          <div class="board" id="board"><svg class="paylines" id="paylines" preserveAspectRatio="none" aria-hidden="true"></svg></div>
          <div class="float-win" id="floatWin" aria-hidden="true"></div>
          <div class="fs-counter" id="fsCounter" hidden></div>
        </section>
        <div class="slot-console">
          <div class="m-info">
            <div class="info-box"><span class="lbl">Créditos <span id="creditMode"></span></span><span class="val" id="balVal">—</span></div>
            <div class="info-box m-win" id="winbar" aria-live="polite"><span class="lbl">Premio de la ronda</span><span class="val" id="winVal">0,00</span></div>
            <div class="info-box"><span class="lbl">Apuesta total</span><span class="val" id="betVal">—</span></div>
          </div>
          <div class="m-controls">
            <button class="ctl" id="menuBtn" type="button" aria-label="Pagos, reglas e historial">Menú</button>
            <button class="ctl" id="autoBtn" type="button" aria-label="Juego automático">Auto</button>
            <button class="ctl" id="turboBtn" type="button" aria-pressed="false">Turbo</button>
            <button class="ctl bet-adjust" id="betDown" type="button" aria-label="Bajar apuesta">−</button>
            <button class="ctl bet-adjust" id="betUp" type="button" aria-label="Subir apuesta">+</button>
            <button class="spin" id="spinBtn" type="button" aria-label="Girar" data-stop-label="Detener giros automáticos"><svg class="spin-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M37 16a15 15 0 1 0 1 15M37 7v11H26"/></svg><span class="spin-label">Girar</span><span class="spin-stop">Parar</span><span class="spin-auto" id="spinAuto"></span></button>
          </div>
          <footer class="m-sub"><span class="rtp-note" id="rtpNote"></span><span class="age-note">18+</span></footer>
        </div>
      </section>
      <div class="overlay" id="overlay" hidden></div>
    </div>
  </main>
  <dialog class="sheet" id="menuDlg" aria-label="Información del juego">
    <div class="sheet-head"><h2>El santuario</h2><form method="dialog"><button class="x" aria-label="Cerrar">×</button></form></div>
    <div class="sheet-tabs"><button class="stab on" data-tab="pay" type="button">Pagos</button><button class="stab" data-tab="rules" type="button">Reglas</button><button class="stab" data-tab="hist" type="button">Historial</button></div>
    <div class="sheet-body" id="menuBody"></div>
  </dialog>
  <dialog class="sheet small" id="autoDlg" aria-label="Juego automático">
    <div class="sheet-head"><h2>Giros automáticos</h2><form method="dialog"><button class="x" aria-label="Cerrar">×</button></form></div>
    <div class="auto-grid" id="autoGrid"></div>
    <label class="check"><input type="checkbox" id="autoStopFeature" checked> Parar al activar giros gratis</label>
  </dialog>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
